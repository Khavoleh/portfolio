name: Pull Request Build

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - '**/*.json'
      - '**/*.ts'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.astro'
      - 'astro.config.json'
      - 'pnpm-lock.yaml'
      - 'package.json'

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/shared/setup

      - name: Run build
        run: pnpm build
