name: CodeQL Actions Analysis

permissions:
  contents: read
  security-events: write

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '.github/**'
  schedule:
    - cron: '0 0 * * 0'

jobs:
  codeql-actions:
    name: Analyze GitHub Actions with CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4
        with:
          languages: actions

      - name: Autobuild
        uses: github/codeql-action/autobuild@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4
        with:
          category: '/language:actions'
