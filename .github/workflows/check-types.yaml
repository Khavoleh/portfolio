name: Pull Request Check Types

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**/*.astro'
      - '**/*.ts'
      - 'pnpm-lock.yaml'
      - 'package.json'

jobs:
  check-types:
    name: Check Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup
        uses: ./.github/shared/setup

      - name: Run type checks
        run: pnpm astro check
