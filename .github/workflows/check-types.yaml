name: Pull Request Check Types

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**/*.astro'
      - '**/*.ts'
      - 'pnpm-lock.yaml'
      - 'package.json'

jobs:
  check-types:
    name: Check Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup
        uses: ./.github/shared/setup

      - name: Run type checks
        run: pnpm astro check
