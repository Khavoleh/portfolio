name: Pull Request Check Types

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**/*.astro'
      - '**/*.ts'
      - 'pnpm-lock.yaml'
      - 'package.json'

jobs:
  check-types:
    name: Check Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup
        uses: ./.github/shared/setup

      - name: Run type checks
        run: pnpm astro check