name: Nuclei DAST Production Scan

permissions:
  contents: read

on:
  schedule:
    - cron: '0 8 * * *'

jobs:
  dast:
    name: Run Nuclei DAST Production Scan
    runs-on: ubuntu-latest

    steps:
      - name: Nuclei Scan
        uses: projectdiscovery/nuclei-action@32a91c0683074f637775531d0442e97914081c7e # v3
        with:
          target: https://www.khavol.com
          flags: '-severity low,medium,high,critical'

      - name: Upload Production Artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: nuclei-production-report
          path: nuclei-results.sarif
          retention-days: 7
