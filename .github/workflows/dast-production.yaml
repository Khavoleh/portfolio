name: Nuclei DAST Production Scan

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  dast:
    name: Run Nuclei DAST Production Scan
    runs-on: ubuntu-latest

    steps:
      - name: Nuclei Scan
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3
        with:
          args: '-u https://www.khavol.com -severity low,medium,high,critical'
