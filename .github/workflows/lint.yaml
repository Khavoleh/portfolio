name: Pull Request Lint

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - '**/*.json'
      - '**/*.ts'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.astro'
      - 'biome.json'
      - 'pnpm-lock.yaml'
      - 'package.json'
jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup
        uses: ./.github/shared/setup

      - name: Run Biome
        run: pnpm lint

      - name: Run Prettier
        run: pnpm prettier --check .
