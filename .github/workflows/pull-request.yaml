name: Pull Request

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup
        uses: ./.github/shared/setup

      - name: Run Biome
        run: pnpm lint

      - name: Run Prettier
        run: pnpm prettier --check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup
        uses: ./.github/shared/setup

      - name: Run tests
        run: pnpm test
