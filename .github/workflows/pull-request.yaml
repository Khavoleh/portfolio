name: Pull Request

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Setup
        uses: ./.github/shared/setup

      - name: Run ESLint
        run: pnpm lint

      - name: Run Prettier
        run: pnpm prettier --check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Setup
        uses: ./.github/shared/setup

      - name: Run tests
        run: pnpm test
