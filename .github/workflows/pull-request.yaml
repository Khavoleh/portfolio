name: Pull Request

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup
        uses: ./.github/shared/setup

      - name: Run ESLint
        run: pnpm lint

      - name: Run Prettier
        run: pnpm prettier --check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup
        uses: ./.github/shared/setup

      - name: Run tests
        run: pnpm test
