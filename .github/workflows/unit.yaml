name: Pull Request Unit Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**/*.ts'
      - 'vitest.config.ts'
      - 'pnpm-lock.yaml'
      - 'package.json'

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup
        uses: ./.github/shared/setup

      - name: Run unit tests
        run: pnpm unit
